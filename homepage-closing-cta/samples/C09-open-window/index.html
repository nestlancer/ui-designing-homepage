<style>

*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse 70% 100% at 50% 0%,var(--mint),transparent 75%),var(--bg);color:var(--body);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}h2,p{margin:0}a{color:inherit;text-decoration:none}:focus-visible{outline:3px solid var(--teal);outline-offset:3px;border-radius:5px}.wrap{width:min(1120px,calc(100% - 48px));margin:auto}.mono,.eyebrow,.theme{font-family:var(--mono)}

.js .window{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .7s cubic-bezier(.22,.61,.36,1)}.js .window.is-in{opacity:1;transform:none}.js .window-bar{transform:scaleX(0);transform-origin:left;transition:transform .8s .16s cubic-bezier(.22,.61,.36,1)}.js .window.is-in .window-bar{transform:scaleX(1)}

<script>(function(){var r=document.documentElement,b=document.querySelector('.theme'),target=document.querySelector('[data-reveal]'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;function sync(){var d=r.dataset.theme==='dark';b.setAttribute('aria-pressed',String(d));b.setAttribute('aria-label',d?'Switch to light theme':'Switch to dark theme');b.textContent=d?'LIGHT':'DARK'}b.addEventListener('click',function(){r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('nl-theme',r.dataset.theme)}catch(e){}sync()});sync();if(reduce||!('IntersectionObserver'in window)){target.classList.add('is-in');return}var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){target.classList.add('is-in');io.disconnect()}})},{threshold:.12});io.observe(target)})();</script>

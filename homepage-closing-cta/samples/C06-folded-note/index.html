<style>

kground .18s,border-color .18s,color .18s,transform .18s}.primary{background:var(--btn);color:var(--btn-text)}.primary:hover{background:var(--ink-2);transform:translateY(-2px)}.secondary{border-color:var(--line);background:var(--surface);color:var(--ink-2)}.secondary:hover{border-color:var(--teal-text);color:var(--teal-text)}.arrow{font-size:18px}
.js .paper{opacity:0;transform:translateY(16px) rotate(.45deg);transition:opacity .65s ease,transform .8s cubic-bezier(.22,.61,.36,1)}.js .paper.is-in{opacity:1;transform:none}.js .check{opacity:0;transform:translateY(7px);transition:opacity .4s ease,transform .45s ease;transition-delay:var(--d,0ms)}.js .paper.is-in .check{opacity:1;transform:none}
@media(max-width:720px){.wrap{width:calc(100% - 34px)}.note-section{padding:64px 0}.top{grid-template-columns:1fr;gap:18px}.headline{max-width:13ch}.lead{max-width:58ch}.actions{align-items:flex-start;flex-direction:column}.secondary{border-color:transparent;padding-left:4px}.primary{width:100%}}@media(max-width:480px){.paper{padding:29px 21px 25px}.paper:before,.paper:after{width:51px;height:51px}.fold-mark{right:13px;top:13px;font-size:8px}.headline{font-size:clamp(45px,13vw,60px)}.lead{font-size:16px}.checks{grid-template-columns:1fr;margin-top:30px}.check{min-height:48px}.actions{margin-top:24px;padding-top:18px}.primary{width:100%}}

<script>(function(){var r=document.documentElement,b=document.querySelector('.theme'),target=document.querySelector('[data-reveal]'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;function sync(){var d=r.dataset.theme==='dark';b.setAttribute('aria-pressed',String(d));b.setAttribute('aria-label',d?'Switch to light theme':'Switch to dark theme');b.textContent=d?'LIGHT':'DARK'}b.addEventListener('click',function(){r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('nl-theme',r.dataset.theme)}catch(e){}sync()});sync();if(reduce||!('IntersectionObserver'in window)){target.classList.add('is-in');return}var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){target.classList.add('is-in');io.disconnect()}})},{threshold:.12});io.observe(target)})();</script>

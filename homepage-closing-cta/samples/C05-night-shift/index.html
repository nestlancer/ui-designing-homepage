<style>

<script>(function(){var r=document.documentElement,b=document.querySelector('.theme'),target=document.querySelector('[data-reveal]'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;function sync(){var d=r.dataset.theme==='dark';b.setAttribute('aria-pressed',String(d));b.setAttribute('aria-label',d?'Switch to light theme':'Switch to dark theme');b.textContent=d?'LIGHT':'DARK'}b.addEventListener('click',function(){r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('nl-theme',r.dataset.theme)}catch(e){}sync()});sync();if(reduce||!('IntersectionObserver'in window)){target.classList.add('is-in');return}var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){target.classList.add('is-in');io.disconnect()}})},{threshold:.12});io.observe(target)})();</script>

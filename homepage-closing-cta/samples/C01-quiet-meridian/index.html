<style>
:root{color-scheme:light;--bg:#f9fbfc;--surface:#fff;--tint:#edf4f6;--mint:#eef7f5;--ink:#0a2543;--ink-2:#123a5e;--body:#4a5c6e;--muted:#5f7080;--line:#e3ebe9;--teal:#1f7a72;--teal-text:#1c6f68;--teal-soft:#d9ece9;--btn:#1f7a73;--btn-text:#fff;--shadow:0 10px 30px rgba(10,37,67,.08);--mono:ui-monospace,"SFMono-Regular",Consolas,monospace}
:root[data-theme=dark]{color-scheme:dark;--bg:#0b1720;--surface:#0f1e29;--tint:#102530;--mint:#10272a;--ink:#e8eef4;--ink-2:#d3dde6;--body:#b9c6d0;--muted:#8aa0b3;--line:#263943;--teal:#2fa59b;--teal-text:#3fb8ab;--teal-soft:#14343a;--btn:#2fa59b;--btn-text:#06111a;--shadow:0 12px 32px rgba(0,0,0,.35)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--body);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}h2,p{margin:0}a{color:inherit;text-decoration:none}:focus-visible{outline:3px solid var(--teal);outline-offset:3px;border-radius:5px}.wrap{width:min(1080px,calc(100% - 48px));margin:auto}.mono,.eyebrow,.theme,.check{font-family:var(--mono)}

.js .eyebrow,.js .headline,.js .lead,.js .checks,.js .actions{opacity:0;transform:translateY(12px);transition:opacity .55s ease,transform .65s cubic-bezier(.22,.61,.36,1)}.js .headline{transition-delay:70ms}.js .lead{transition-delay:130ms}.js .checks{transition-delay:180ms}.js .actions{transition-delay:260ms}.js .is-in .eyebrow,.js .is-in .headline,.js .is-in .lead,.js .is-in .checks,.js .is-in .actions{opacity:1;transform:none}.js .checks{position:relative}.js .checks:before{content:"";position:absolute;left:0;right:0;top:-1px;height:1px;background:var(--teal);transform:scaleX(0);transform-origin:center;transition:transform .9s .2s cubic-bezier(.22,.61,.36,1)}.js .is-in .checks:before{transform:scaleX(1)}
@media(max-width:760px){.wrap{width:calc(100% - 36px)}.checks{grid-template-columns:1fr 1fr;row-gap:4px;margin-top:34px}.check:nth-child(3){border-left:0}.check:nth-child(3),.check:nth-child(4){border-top:1px solid var(--line)}}@media(max-width:480px){.meridian{padding:74px 0 66px}.headline{font-size:clamp(43px,12vw,58px)}.lead{font-size:16px}.checks{grid-template-columns:1fr;padding:8px 0}.check{padding:8px 4px}.check+.check{border-left:0;border-top:1px solid var(--line)}.actions{align-items:stretch;flex-direction:column}.btn{width:100%}}

<script>(function(){var root=document.documentElement,button=document.querySelector('.theme'),section=document.querySelector('[data-reveal]'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;function sync(){var d=root.dataset.theme==='dark';button.setAttribute('aria-pressed',String(d));button.setAttribute('aria-label',d?'Switch to light theme':'Switch to dark theme');button.textContent=d?'LIGHT':'DARK'}button.addEventListener('click',function(){root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('nl-theme',root.dataset.theme)}catch(e){}sync()});sync();if(reduce||!('IntersectionObserver'in window)){section.classList.add('is-in');return}var io=new IntersectionObserver(function(entries){entries.forEach(function(entry){if(entry.isIntersecting){section.classList.add('is-in');io.disconnect()}})},{threshold:.2});io.observe(section)})();</script>
